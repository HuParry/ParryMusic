<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>歌单排序 · ParryMusic</title>
  <link rel="icon" href="/favicon-circle.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/editor.css">
  <script type="module" src="/editor.mjs"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true">
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3h2ZM7 3v6h10V3M7 21v-8h10v8"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></symbol>
  </svg>
  <div class="shell">
    <header class="site-header">
      <div class="brand"><img src="/brand.webp" alt="" width="35" height="35"><span>ParryMusic</span></div>
      <span class="header-label">歌单排序</span>
      <span class="local-badge"><span></span>本地工具</span>
    </header>
    <main>
      <section class="intro">
        <div><h1>调整歌曲顺序</h1><p class="description">拖动左侧手柄，或点击上下按钮。完成后点击“保存顺序”。</p></div>
        <div class="file-card"><span>正在编辑</span><strong>music/playlist.js</strong><small>保存后上传歌单即可生效</small></div>
      </section>
      <div class="toolbar">
        <div class="list-summary"><h2>歌曲列表 <span id="count">—</span></h2><span id="dirty-state" class="state-badge">正在读取</span></div>
        <div class="actions">
          <button id="reload" class="text-button" disabled>重新读取</button>
          <button id="discard" class="text-button" disabled>放弃修改</button>
          <button id="save" class="primary-button" disabled><svg class="icon"><use href="#i-save"/></svg>保存顺序</button>
        </div>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite">正在读取歌单…</div>
      <div class="list-heading" aria-hidden="true"><span>顺序</span><span>歌曲 / 歌手</span><span>调整位置</span></div>
      <ol id="songs" class="songs" aria-label="歌曲顺序"></ol>
      <div id="empty" class="empty" hidden><span>♪</span><h2>歌单里还没有歌曲</h2><p>先生成歌单，再点击“重新读取”。</p></div>
      <footer class="page-footer"><span>每次保存都会备份原歌单</span><span>Ctrl / ⌘ + S 保存</span></footer>
    </main>
  </div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">放弃尚未保存的调整？</h2><p id="confirm-description">这会恢复打开网页时的歌曲顺序。</p>
    <div class="dialog-actions"><button id="keep-editing" class="text-button" autofocus>继续调整</button><button id="confirm-discard" class="primary-button">放弃修改</button></div>
  </dialog>
</body>
</html>
